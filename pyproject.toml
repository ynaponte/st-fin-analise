[project]
name = "finalise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ynã Ponte", email = "ynaqp@alu.ufc.br" }
]
requires-python = ">=3.12"
dependencies = [
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
